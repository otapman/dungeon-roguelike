  function cellHtml(x,y){

    if(!wall){
      const up=x===state.upStair.x&&y===state.upStair.y,down=x===state.downStair?.x&&y===state.downStair?.y;
      if(up){art+=pixelArt('up');label='올라가는 계단';}
      if(down){art+=pixelArt('down');label=state.bossDefeated?'내려가는 계단':'내려가는 계단 · 보스 처치 필요';}
      if(x===state.bossDoor.x&&y===state.bossDoor.y&&!state.bossOpen&&!state.bossDefeated){art+=pixelArt('door')+'<i class="door-mark">'+monsterArt(state.boss)+'</i>';label='보스방: '+state.boss.name;}
      if(vis){const it=state.items.find(i=>i.x===x&&i.y===y);if(it){art+=pixelArt(it.type);label=it.label;}
        const m=findMonster(x,y),b=state.bossOpen&&state.boss.hp>0&&state.boss.x===x&&state.boss.y===y?state.boss:null;
        if(m||b){const actor=b||m;art+=monsterArt(actor)+awarenessBadge(actor);label=actor.name+' · '+awareness(actor).label;}
        if(state.player.x===x&&state.player.y===y){art+=pixelArt('player-'+state.race+'-'+state.class);label='플레이어 · '+state.race+' '+state.class;}
      }
    }
    return '<span data-cell="'+x+','+y+'" class="tile pixel-tile '+(vis?'':'memory')+'" title="'+label+'" aria-label="'+label+'">'+art+'</span>';
  }

  function renderDungeon(){state.revealed=state.revealed||Array.from({length:19},()=>Array(state.map[0].length).fill(false));for(let y=0;y<19;y++)for(let x=0;x<state.map[0].length;x++)if(visible(x,y))state.revealed[y][x]=true;const viewW=15,viewH=15,halfW=Math.floor(viewW/2),halfH=Math.floor(viewH/2);const grid=Array.from({length:viewH},(_,vy)=>Array.from({length:viewW},(_,vx)=>cellHtml(state.player.x+vx-halfW,state.player.y+vy-halfH)).join('')).join('');const nearby=state.monsters.filter(m=>m.hp>0&&visible(m.x,m.y));const bossNear=state.bossOpen&&state.boss&&state.boss.hp>0&&visible(state.boss.x,state.boss.y);const target=state.pendingSkill?'대상을 선택하세요.':bossNear?`${state.boss.name} · ${damageLabel(state.boss)} · ${awareness(state.boss).label} · HP ${Math.max(0,state.boss.hp)}/${state.boss.maxHp}`:nearby[0]?`${nearby[0].name} · ${damageLabel(nearby[0])} · ${awareness(nearby[0]).label}`:'주변에 적이 없습니다.';$('#stage').innerHTML=`<div class="screen-title"><h2>제 ${state.floor}층 · ${state.bossDefeated?'길이 열렸다':'보스 제한 시간'}</h2><span>${state.timer} turns remaining</span></div><div class="dungeon-wrap"><div><div class="map-shell"><div class="map">${grid}</div><div class="map-note"><span>● 시야 안 · ◌ 기억한 지형</span><span>플레이어 중심 카메라 · 보스: ${state.boss.name}</span></div></div><div class="message">${target}</div><div class="legend awareness-legend"><span><b class="asleep">z</b> 수면 중</span><span><b class="awake">○</b> 깨어있음</span><span><b class="suspicious">?</b> 이상 감지</span><span><b class="spotted">!</b> 플레이어 발견</span></div><div class="legend"><span>${pixelArt('player-'+state.race+'-'+state.class)} 나</span><span>${pixelArt('hound')} 적</span><span>${pixelArt('door')} 보스방</span><span>${pixelArt('up')} 위층</span><span>${pixelArt('down')} 아래층</span><span>${pixelArt('potion')} 물약</span></div></div><div class="combat-panel"><h3>${state.race} ${state.class}</h3><div class="bar-label"><span>HP</span><b>${Math.max(0,state.player.hp)} / ${state.player.maxHp}</b></div><div class="bar hp"><i style="width:${state.player.hp/state.player.maxHp*100}%"></i></div><div class="bar-label"><span>MP</span><b>${state.player.mp} / ${state.player.maxMp}</b></div><div class="bar mp"><i style="width:${state.player.mp/state.player.maxMp*100}%"></i></div><div class="stat-line"><span>방어 / 재생</span><strong>${state.player.def} / +${state.player.regen}</strong></div><div class="stat-line"><span>골드</span><strong class="gold">${state.gold}</strong></div><div class="stat-line"><span>레벨</span><strong>${state.level} · XP ${state.xp}/${state.nextXp}</strong></div><div class="controls"><button data-move="Numpad7">↖</button><button data-move="Numpad8">↑</button><button data-move="Numpad9">↗</button><button data-move="Numpad4">←</button><button data-move="Numpad5" title="한 턴 대기">·</button><button data-move="Numpad6">→</button><button data-move="Numpad1">↙</button><button data-move="Numpad2">↓</button><button data-move="Numpad3">↘</button></div><div class="actions"><button id="explore">${state.exploring?'자동 탐험 중 · 취소 [아무 키]':'자동 탐험 [E]'}</button><button id="rest">${state.resting?'휴식 중 · 취소 [아무 키]':'완전 회복까지 휴식 [H]'}</button><button id="showMap">탐험 지도 [M]</button>${state.class==='궁수'?'<button id="bowAttack">일반 활 공격 [F] · 사거리 5 · MP 0</button>':''}<button id="skill">✦ ${classes[state.class].skill} [1] · MP ${classes[state.class].skillCost}</button><button id="potion">♙ 물약 사용 · ${state.potions||0}개</button><button id="openBoss" ${state.bossDefeated?'disabled':''}>▣ 보스방 열기</button><button id="returnTown">↟ 1층 마을 계단으로 귀환</button></div><div class="log">${state.logs.map(x=>`<p>${x}</p>`).join('')}</div></div></div>`;$('#side').innerHTML=`<div class="section-label">탐험 규칙</div><div class="stat-line"><span>턴</span><strong>${state.turn}</strong></div><div class="stat-line"><span>제한</span><strong>${state.bossDefeated?'해제':state.timer+' 남음'}</strong></div><div class="stat-line"><span>보스</span><strong>${state.boss.name}</strong></div><div class="section-label">발견</div><div class="stat-line"><span>마법서</span><strong>${state.book?'화염':'미발견'}</strong></div><div class="stat-line"><span>포인트</span><strong>${state.points} (마을에서 투자)</strong></div><div class="section-label">행동</div><p style="color:var(--muted);font:12px/1.65 ui-monospace,monospace">공격은 조건 충족 시 필중<br>피해는 주사위 굴림<br>방어력은 고정 차감<br>화염 저항은 비율 감소</p>`}

  function toggleMap(){if(state.screen!=='dungeon')return;state.mapView=!state.mapView;render()}
  function renderMap(){
    const grid=state.map.map((row,y)=>row.map((_,x)=>cellHtml(x,y)).join('')).join('');
    const overlay=document.createElement('div');overlay.className='map-overlay';overlay.id='exploredMap';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','탐험 지도');
    overlay.innerHTML='<div class="map-dialog"><div class="screen-title"><h2>제 '+state.floor+'층 · 탐험 지도</h2><button id="closeMap">닫기 [M / Esc]</button></div><p>밝힌 지형만 표시합니다. 금색 발판이 현재 위치입니다. 지도 확인 중에는 턴이 흐르지 않습니다.</p><div class="full-map-scroll"><div class="full-map" style="grid-template-columns:repeat('+state.map[0].length+',24px)">'+grid+'</div></div><p>밝은 곳: 현재 시야 · 어두운 곳: 기억한 지형 · 검은 곳: 미탐색</p></div>';
    document.body.appendChild(overlay);overlay.querySelector('#closeMap').focus();
  }
  function renderDeath(){ $('#stage').innerHTML=`<div class="death"><div class="skull">☠</div><div class="eyebrow">the run is over</div><h2>당신은 쓰러졌습니다</h2><p>부활은 존재하지 않습니다. 이 캐릭터의 지식과 장비는 사라졌습니다.<br>다음 모험에서는 당신이 기억한 것만이 남습니다.</p><button class="primary" id="newCharacter">새 캐릭터 만들기</button></div>`;$('#side').innerHTML=`<div class="section-label">마지막 기록</div><div class="stat-line"><span>도달 층</span><strong>${state.floor}</strong></div><div class="stat-line"><span>레벨</span><strong>${state.level}</strong></div><div class="stat-line"><span>처치 골드</span><strong>${state.gold}</strong></div>`}
  function render(){ document.querySelector('#exploredMap')?.remove();$('#headerMeta').innerHTML=state.screen==='dungeon'?`<strong>${state.race} ${state.class}</strong><br>런 ${state.run} · 제 ${state.floor}층 · ${(floorConfigs[state.floor]||floorConfigs[3]).theme}`:state.screen==='town'?`<strong>횃불마을</strong><br>런 ${state.run||'새'} · 귀환 후 준비`: '새 런 · 캐릭터를 선택하세요';if(state.screen==='setup')renderSetup();else if(state.screen==='town')renderTown();else if(state.screen==='dungeon'){renderDungeon();aimOverlay();if(state.mapView)renderMap()}else renderDeath()}
  document.addEventListener('keydown',e=>{if(state.exploring){e.preventDefault();e.stopImmediatePropagation();stopExplore('자동 탐험을 취소했습니다.');return}if(e.code==='KeyE'&&state.screen==='dungeon'&&!state.mapView&&!state.aim&&!state.resting){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)startExplore()}},true);
  document.addEventListener('click',e=>{if(state.stairTraveling){e.preventDefault();e.stopImmediatePropagation();stopStair('계단 이동을 취소했습니다.');return}if(state.exploring){e.preventDefault();e.stopImmediatePropagation();stopExplore('자동 탐험을 취소했습니다.');return}if(e.target.closest('#explore')&&!state.mapView&&!state.aim&&!state.resting){e.stopImmediatePropagation();startExplore()}},true);
  document.addEventListener('keydown',e=>{if(state.resting){e.preventDefault();e.stopImmediatePropagation();stopRest('휴식을 취소했습니다.');return}if(e.code==='KeyH'&&state.screen==='dungeon'&&!state.mapView&&!state.aim){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)startRest()}},true);
  document.addEventListener('click',e=>{if(state.resting){e.preventDefault();e.stopImmediatePropagation();stopRest('휴식을 취소했습니다.');return}if(e.target.closest('#rest')&&!state.mapView&&!state.aim){e.stopImmediatePropagation();startRest()}},true);
  document.addEventListener('keydown',e=>{if(state.stairTraveling){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)stopStair('계단 이동을 취소했습니다.');return}if(state.screen!=='dungeon')return;if(state.mapView){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat&&(e.code==='KeyM'||e.code==='Escape'))toggleMap();return}if((e.key==='<'||(e.code==='Comma'&&e.shiftKey))||(e.key==='>'||(e.code==='Period'&&e.shiftKey))){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)startStairTravel((e.key==='<'||(e.code==='Comma'&&e.shiftKey))?'up':'down')}else if(e.code==='KeyM'){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)toggleMap()}},true);
  document.addEventListener('click',e=>{if(state.mapView){e.stopImmediatePropagation();if(e.target.closest('#closeMap'))toggleMap();return}if(e.target.closest('#showMap')){e.stopImmediatePropagation();toggleMap()}},true);
  document.addEventListener('click',e=>{if(!state.aim)return;const tile=e.target.closest('[data-cell]');const b=e.target.closest('button');if(tile){const [x,y]=tile.dataset.cell.split(',').map(Number);state.aim={x,y};render()}else if(b?.id==='cancelAim')cancelAim();else if(b?.id==='confirmAim')confirmAim();else if(b?.id==='skill')useSkill();else if(b?.id==='bowAttack')useSkill('bow');else if(b?.dataset.move){const d=dirKeys[b.dataset.move];if(d)shiftAim(...d);else confirmAim()}e.stopImmediatePropagation()},true);
  document.addEventListener('keydown',e=>{if(!state.aim)return;e.preventDefault();e.stopImmediatePropagation();if(e.repeat)return;if(e.code==='KeyF')useSkill('bow');else if(e.code==='Digit1')useSkill();else if(e.code==='Escape')cancelAim();else if(e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Numpad5')confirmAim();else if(e.code==='Tab')cycleAim();else if(dirKeys[e.code])shiftAim(...dirKeys[e.code])},true);
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.race){state.race=b.dataset.race;renderSetup()}else if(b.dataset.class){state.class=b.dataset.class;renderSetup()}else if(b.id==='begin')newRun();else if(b.id==='bowAttack')useSkill('bow');else if(b.id==='skill')useSkill();else if(b.id==='potion')usePotion();else if(b.id==='openBoss')openBoss();else if(b.id==='returnTown')returnTown();else if(b.id==='buyPotion')buyPotion();else if(b.id==='appraise')appraise();else if(b.id==='invest')invest();else if(b.id==='enterAgain'){state.floor=1;state.screen='dungeon';generateFloor();render()}else if(b.id==='newCharacter'){state={...state,screen:'setup',gold:0,run:0,floorBosses:{}};render()}else if(b.dataset.move==='Numpad5')waitTurn();else if(b.dataset.move){const d=dirKeys[b.dataset.move];move(d[0],d[1])}});
  document.addEventListener('keydown',e=>{if(state.screen!=='dungeon')return;const key=e.code;if(key==='KeyF'||key==='Digit1'){e.preventDefault();if(!e.repeat)useSkill(key==='KeyF'?'bow':'skill');return}if(key==='Numpad5'){e.preventDefault();waitTurn()}else if(dirKeys[key]){e.preventDefault();const d=dirKeys[key];move(d[0],d[1])}else if(key==='KeyO')openBoss();else if(key==='KeyR')returnTown()});
  render();
})();
</script>
</body>
</html>
